<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroZap</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f1;
      color: #17351f;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #607064;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 15px;
      box-sizing: border-box;
      border: 1px solid #ccd8cc;
      border-radius: 12px;
      resize: none;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #246b3a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1b542d;
    }

    .resultado {
      margin-top: 25px;
      padding: 20px;
      background: #eef6ed;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌱 AgroZap</h1>

    <p>
      Seu assistente digital para a propriedade rural.
    </p>

    <textarea
      id="mensagem"
      placeholder="Exemplo: Comprei 10 sacos de adubo por R$ 1.800"
    ></textarea>

    <button id="botao" onclick="analisar()">
      Analisar mensagem
    </button>

    <div class="resultado" id="resultado"></div>

  </div>

  <script>

    async function analisar() {

      const mensagem = document.getElementById("mensagem").value;
      const resultado = document.getElementById("resultado");
      const botao = document.getElementById("botao");

      if (mensagem.trim() === "") {
        alert("Digite uma mensagem primeiro.");
        return;
      }

      resultado.style.display = "block";
      resultado.innerHTML = "🤖 AgroZap está analisando...";
      botao.disabled = true;

      try {

        const resposta = await fetch("/api/analisar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            mensagem: mensagem
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          resultado.innerHTML =
            "❌ Erro: " +
            (dados.error || "Não foi possível analisar a mensagem.");
          return;
        }

        resultado.innerHTML =
          "<strong>🤖 AgroZap:</strong><br><br>" +
          (dados.resposta || "Não recebi uma resposta da IA.");

      } catch (erro) {

        resultado.innerHTML =
          "❌ Não foi possível conectar ao servidor do AgroZap.";

      } finally {

        botao.disabled = false;

      }
    }

  </script>

</body>
</html>
